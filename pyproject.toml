[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emulation-plan-scenarios"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mal-simulator==3.0.*", "pytest"]
authors = [
    { name = "Sandor Berglund", email = "sandorb@kth.se" }
]
description = "Emulation plan scenarios for the mal-simulator"
keywords = ["mal-simulator", "emulation plan", "scenarios"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[tool.setuptools]
packages = []
